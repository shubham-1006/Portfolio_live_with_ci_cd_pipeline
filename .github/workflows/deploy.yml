name: Build and deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check js/script.js
      - run: bash -n scripts/deploy-ec2.sh

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$AWS_REGION" ]] || { echo "Set the AWS_REGION Actions variable." >&2; exit 1; }
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || {
            echo "Set ECR_REPOSITORY to a valid lowercase ECR repository name." >&2
            exit 1
          }
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]] || {
            echo "Set EC2_INSTANCE_ID to the target EC2 instance ID." >&2
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy image to EC2 through SSM
        shell: bash
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          SCRIPT_B64="$(base64 --wrap=0 scripts/deploy-ec2.sh)"
          PARAMETERS="$(python3 - "$IMAGE_URI" "$AWS_REGION" "$SCRIPT_B64" <<'PY'
          import json
          import shlex
          import sys

          image_uri, region, script_b64 = sys.argv[1:]
          command = (
              f"export IMAGE_URI={shlex.quote(image_uri)} "
              f"AWS_REGION={shlex.quote(region)}; "
              f"printf %s {shlex.quote(script_b64)} | base64 --decode | bash"
          )
          print(json.dumps({"commands": [command]}))
          PY
          )"

          COMMAND_ID="$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "$PARAMETERS" \
            --comment "Deploy portfolio ${GITHUB_SHA}" \
            --query "Command.CommandId" \
            --output text)"

          STATUS="Pending"
          for attempt in $(seq 1 60); do
            if RESPONSE="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>&1)"; then
              STATUS="$RESPONSE"
            elif [[ "$RESPONSE" == *InvocationDoesNotExist* ]]; then
              sleep 5
              continue
            else
              printf '%s\n' "$RESPONSE" >&2
              exit 1
            fi

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for SSM command $COMMAND_ID (last status: $STATUS)." >&2
          exit 1
